name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/edumanage_integration_test
      DATABASE_URL: mongodb://127.0.0.1:27017/edumanage_integration_test
    defaults:
      run:
        working-directory: smsbackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smsbackend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npx prisma db push
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsfrontend
    env:
      # A non-routable value lets CI verify the production bundle without
      # hard-coding a deployment URL in source control.
      VITE_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smsfrontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
